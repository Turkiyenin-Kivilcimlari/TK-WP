# MongoDB configuration file for production

# Network interfaces
net:
  port: 27017
  bindIp: 0.0.0.0

# Storage
storage:
  dbPath: /data/db
  wiredTiger:
    engineConfig:
      cacheSizeGB: 0.5
      journalCompressor: snappy
    collectionConfig:
      blockCompressor: snappy
    indexConfig:
      prefixCompression: true

# Security - Disabled for initial testing
# security:
#   authorization: enabled

# Operation Profiling
operationProfiling:
  slowOpThresholdMs: 100
  mode: slowOp

# Process Management
processManagement:
  fork: false

# System Log - Use file for Docker
systemLog:
  destination: file
  path: /dev/stdout
  logAppend: true
  verbosity: 0

# Set Parameter
setParameter:
  enableLocalhostAuthBypass: true